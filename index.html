body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(145deg,rgba(255,249,198,.7),rgba(226,247,255,.75) 43%,rgba(255,236,223,.64))}
.app{width:min(100%,520px);margin:0 auto}
.toolbar{height:46px;display:flex;justify-content:flex-end;align-items:center}
.share{width:42px;height:42px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.9);box-shadow:0 3px 15px rgba(0,0,0,.08);font-size:22px;cursor:pointer}
.hero{text-align:center;padding:10px 10px 24px}
.cover{width:min(82vw,360px);aspect-ratio:1/1;object-fit:cover;border-radius:8px;box-shadow:0 16px 36px rgba(0,0,0,.18);display:block;margin:0 auto 22px}
h1{margin:0;font-size:31px;line-height:1.15;font-weight:800;letter-spacing:.01em}
.artist{margin-top:8px;font-size:18px;color:#666d78;font-weight:600}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(113,122,143,.17);border-radius:15px;box-shadow:0 8px 28px rgba(53,69,99,.12);overflow:hidden}
.service-row{min-height:93px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);background:#fff;transition:.12s ease}
.service-row:last-child{border-bottom:0}
.service-row:active{transform:scale(.995);background:#fafbfe}
